name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  openhands-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate OpenHands repository hooks
        run: bash -n .openhands/setup.sh .openhands/pre-commit.sh

      - name: Validate OpenHands repository governance
        run: |
          test -s AGENTS.md
          test -s AGENTS.zh-CN.md
          test -s .openhands/skills/repo.md
          test -s docs/scaffold.md
          test -s docs/scaffold.zh-CN.md
          grep -Fq 'AGENTS.md' .openhands/skills/repo.md
          grep -Fq 'enterprise-grade .NET upper-computer development scaffold for industrial device control, automation, and data acquisition' docs/scaffold.md
          grep -Fq '面向工业设备控制、自动化与数据采集的企业级 .NET 上位机开发脚手架' docs/scaffold.zh-CN.md
          grep -Fq 'enterprise-grade .NET upper-computer development scaffold for industrial device control, automation, and data acquisition' AGENTS.md
          grep -Fq '面向工业设备控制、自动化与数据采集的企业级 .NET 上位机开发脚手架' AGENTS.zh-CN.md

      - name: Validate main branch governance contract
        run: python scripts/validate_main_governance.py

      - name: Test GitHub ruleset drift validator
        run: python -m unittest discover -s scripts/tests -p "test_*.py"

  architecture-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate modular-monolith project graph
        run: python scripts/validate_architecture.py

  linux-runtime-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Linux-safe runtime tests
        run: dotnet restore tests/UpperHost.Tests/UpperHost.Tests.csproj

      - name: Test ConnectionManager Linux contract
        run: dotnet test tests/UpperHost.Tests/UpperHost.Tests.csproj -c Release --no-restore --filter "FullyQualifiedName~UpperHost.Tests.ConnectionManagerTests"

      - name: Test AcquisitionSession Linux contract
        run: dotnet test tests/UpperHost.Tests/UpperHost.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~UpperHost.Tests.AcquisitionSessionTests" --blame-hang-timeout 30s --blame-hang-dump-type mini

  build-test-scaffold:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore UpperHost.slnx

      - name: Build
        run: dotnet build UpperHost.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/UpperHost.Tests/UpperHost.Tests.csproj -c Release --no-build --blame-hang-timeout 2m --blame-hang-dump-type mini

      - name: Pack libraries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/packages | Out-Null
          Get-ChildItem src -Filter *.csproj -Recurse | ForEach-Object {
            dotnet pack $_.FullName -c Release --no-build -o artifacts/packages
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Validate source-scaffold compatibility contract
        run: python scripts/validate_source_scaffold_contract.py

      - name: Install pinned ApiCompat
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/tools | Out-Null
          dotnet tool install Microsoft.DotNet.ApiCompat.Tool --tool-path artifacts/tools --version 10.0.400

      - name: Prove compatibility gate detects API drift
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: ./scripts/test_compatibility_gate.ps1 -ApiCompatPath artifacts/tools/apicompat.exe

      - name: Download exact-base compatibility packages
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/download_compatibility_baseline.ps1 -Repository $env:GITHUB_REPOSITORY -BaseSha $env:BASE_SHA -OutputDirectory artifacts/baseline

      - name: Validate Runtime public API compatibility
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/validate_compatibility.ps1 -CurrentPackageDirectory artifacts/packages -BaselinePackageDirectory artifacts/baseline -ApiCompatPath artifacts/tools/apicompat.exe

      - name: Validate source-first scaffold entry
        shell: pwsh
        run: |
          dotnet build app/UpperHost.App/UpperHost.App.csproj -c Release --no-restore

      - uses: actions/upload-artifact@v4
        with:
          name: upperhost-packages
          path: artifacts/packages/*.nupkg
