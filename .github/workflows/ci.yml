name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-template:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore UpperHost.slnx

      - name: Build
        run: dotnet build UpperHost.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/UpperHost.Tests/UpperHost.Tests.csproj -c Release --no-build

      - name: Pack libraries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/packages | Out-Null
          Get-ChildItem src -Filter *.csproj -Recurse | ForEach-Object {
            dotnet pack $_.FullName -c Release --no-build -o artifacts/packages
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          dotnet pack templates/UpperHost.Templates.csproj -c Release --no-build -o artifacts/packages

      - name: Validate dotnet new template
        shell: pwsh
        run: |
          $packageDir = (Resolve-Path artifacts/packages).Path
          $templatePackage = (Get-ChildItem "$packageDir/UpperHost.Templates.*.nupkg" | Select-Object -First 1).FullName
          $nugetSource = "https://api.nuget.org/v3/index.json"
          dotnet new install $templatePackage

          $smokeDir = Join-Path $env:RUNNER_TEMP "upperhost-template-smoke"
          Remove-Item $smokeDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $smokeDir | Out-Null
          Push-Location $smokeDir
          dotnet new upperhost -n SmokeDevice --transport simulator
          dotnet restore SmokeDevice/SmokeDevice.csproj --source "$packageDir" --source "$nugetSource"
          dotnet build SmokeDevice/SmokeDevice.csproj -c Release --no-restore
          Pop-Location

      - uses: actions/upload-artifact@v4
        with:
          name: upperhost-packages
          path: artifacts/packages/*.nupkg
