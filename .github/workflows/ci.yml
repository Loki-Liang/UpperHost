name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  openhands-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate OpenHands repository hooks
        run: bash -n .openhands/setup.sh .openhands/pre-commit.sh

      - name: Validate layered AI/OpenHands governance
        run: python scripts/validate_agent_governance.py

      - name: Validate OpenHands repository positioning
        run: |
          test -s docs/scaffold.md
          test -s docs/scaffold.zh-CN.md
          grep -Fq 'enterprise-grade .NET upper-computer development scaffold for industrial device control, automation, and data acquisition' docs/scaffold.md
          grep -Fq '面向工业设备控制、自动化与数据采集的企业级 .NET 上位机开发脚手架' docs/scaffold.zh-CN.md
          grep -Fq 'enterprise-grade .NET upper-computer development scaffold for industrial device control, automation, and data acquisition' AGENTS.md
          grep -Fq '面向工业设备控制、自动化与数据采集的企业级 .NET 上位机开发脚手架' AGENTS.zh-CN.md

      - name: Validate main branch governance contract
        run: python scripts/validate_main_governance.py

      - name: Validate acquisition verification profiles
        run: python scripts/validate_acquisition_verification.py

      - name: Test governance and verification validators
        run: python -m unittest discover -s scripts/tests -p "test_*.py"

  architecture-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate modular-monolith project graph
        run: python scripts/validate_architecture.py

      - name: Validate OpenDeviceStudio brand migration closure
        run: python scripts/validate_brand_migration.py

  linux-runtime-contract:
    runs-on: ubuntu-latest
    env:
      ACQ_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ACQ_EXACT_SHA }}
          fetch-depth: 0

      - name: Verify Tier A exact-head checkout
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$ACQ_EXACT_SHA" || {
            echo "Tier A expected exact head $ACQ_EXACT_SHA, got $actual" >&2
            exit 1
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate pinned diagnostic tools
        run: dotnet tool restore

      - name: Restore Linux-safe runtime tests
        run: dotnet restore tests/OpenDeviceStudio.Tests/OpenDeviceStudio.Tests.csproj

      - name: Restore acquisition verification runner
        run: dotnet restore tools/OpenDeviceStudio.Acquisition.Verification/OpenDeviceStudio.Acquisition.Verification.csproj

      - name: Restore acquisition benchmark harness
        run: dotnet restore benchmarks/OpenDeviceStudio.Benchmarks/OpenDeviceStudio.Benchmarks.csproj

      - name: Build acquisition benchmark harness
        run: dotnet build benchmarks/OpenDeviceStudio.Benchmarks/OpenDeviceStudio.Benchmarks.csproj -c Release --no-restore

      - name: Raw format decision spike
        run: dotnet run --project benchmarks/OpenDeviceStudio.RawFormatSpike/OpenDeviceStudio.RawFormatSpike.csproj -c Release

      - name: Test ConnectionManager Linux contract
        run: dotnet test tests/OpenDeviceStudio.Tests/OpenDeviceStudio.Tests.csproj -c Release --no-restore --filter "FullyQualifiedName~OpenDeviceStudio.Tests.ConnectionManagerTests"

      - name: Test AcquisitionSession Linux contract
        run: dotnet test tests/OpenDeviceStudio.Tests/OpenDeviceStudio.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~OpenDeviceStudio.Tests.AcquisitionSessionTests" --blame-hang-timeout 30s --blame-hang-dump-type mini

      - name: Test Raw Recorder Linux contract
        run: dotnet test tests/OpenDeviceStudio.Tests/OpenDeviceStudio.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~OpenDeviceStudio.Tests.RawRecorderTests" --blame-hang-timeout 30s --blame-hang-dump-type mini

      - name: Test Acquisition Verification Tier A
        run: dotnet test tests/OpenDeviceStudio.Tests/OpenDeviceStudio.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~OpenDeviceStudio.Tests.AcquisitionVerificationTests" --blame-hang-timeout 45s --blame-hang-dump-type mini

      - name: Run Acquisition Tier A short soak
        run: >
          dotnet run --project tools/OpenDeviceStudio.Acquisition.Verification/OpenDeviceStudio.Acquisition.Verification.csproj
          -c Release --no-restore --
          --profile eng/acquisition-verification/profiles/small-reference.json
          --artifact-dir artifacts/acquisition-tier-a
          --seed 6201
          --max-blocks-per-source 300
          --timeout-seconds 90

      - name: Upload Acquisition Tier A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acquisition-tier-a-${{ env.ACQ_EXACT_SHA }}
          path: artifacts/acquisition-tier-a
          if-no-files-found: warn
          retention-days: 14

  build-test-scaffold:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore OpenDeviceStudio.slnx

      - name: Build
        run: dotnet build OpenDeviceStudio.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/OpenDeviceStudio.Tests/OpenDeviceStudio.Tests.csproj -c Release --no-build --blame-hang-timeout 2m --blame-hang-dump-type mini

      - name: Pack libraries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/packages | Out-Null
          Get-ChildItem src -Filter *.csproj -Recurse | ForEach-Object {
            dotnet pack $_.FullName -c Release --no-build -o artifacts/packages
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Validate source-scaffold compatibility contract
        run: python scripts/validate_source_scaffold_contract.py

      - name: Install pinned ApiCompat
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/tools | Out-Null
          dotnet tool install Microsoft.DotNet.ApiCompat.Tool --tool-path artifacts/tools --version 10.0.400

      - name: Prove compatibility gate detects API drift
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: ./scripts/test_compatibility_gate.ps1 -ApiCompatPath artifacts/tools/apicompat.exe

      - name: Download exact-base compatibility packages
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/download_compatibility_baseline.ps1 -Repository $env:GITHUB_REPOSITORY -BaseSha $env:BASE_SHA -OutputDirectory artifacts/baseline

      - name: Validate Runtime public API compatibility
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/validate_compatibility.ps1 -CurrentPackageDirectory artifacts/packages -BaselinePackageDirectory artifacts/baseline -ApiCompatPath artifacts/tools/apicompat.exe

      - name: Validate source-first scaffold entry
        shell: pwsh
        run: |
          dotnet build app/OpenDeviceStudio.App/OpenDeviceStudio.App.csproj -c Release --no-restore

      - uses: actions/upload-artifact@v4
        with:
          name: opendevicestudio-packages
          path: artifacts/packages/*.nupkg
